[defaults]
inventory = inventories/qualification/hosts.example.yml
roles_path = roles
collections_path = .collections
forks = 1
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
deprecation_warnings = True
nocows = True
local_tmp = .integration-temp/ansible/local-tmp
remote_tmp = /tmp/azpr-ansible-${USER}

[privilege_escalation]
become = False
